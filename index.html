<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashu Tiles & Stones Work | Shamli</title>

    <style>

        :root{
            --bg-color:#0b111e;
            --card-bg:#151f32;
            --accent-color:#d4af37;
            --text-main:#ffffff;
            --text-muted:#94a3b8;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background-color:var(--bg-color);
            color:var(--text-main);
        }

        header{
            position:fixed;
            top:0;
            width:100%;
            background:rgba(11,17,30,0.95);
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            z-index:1000;
        }

        .logo{
            font-size:24px;
            font-weight:700;
        }

        .logo span{
            color:var(--accent-color);
        }

        .hamburger{
            display:flex;
            flex-direction:column;
            gap:5px;
            cursor:pointer;
        }

        .hamburger span{
            width:30px;
            height:3px;
            background:white;
            border-radius:10px;
        }

        section{
            padding:100px 8% 60px;
            text-align:center;
        }

        h1{
            font-size:50px;
            line-height:1.3;
        }

        h2{
            font-size:38px;
            margin-bottom:25px;
        }

        .upload-box{
            max-width:600px;
            margin:0 auto;
            background:var(--card-bg);
            padding:40px;
            border-radius:20px;
            border:2px dashed var(--accent-color);
        }

        input[type=file]{
            display:none;
        }

        .choose-btn{
            background:#d4af37;
            color:black;
            padding:16px 35px;
            border-radius:40px;
            cursor:pointer;
            display:inline-block;
            margin:15px 0;
            font-size:20px;
            font-weight:600;
        }

        select{
            width:100%;
            padding:15px;
            margin:15px 0;
            border-radius:12px;
            background:#1e2a44;
            color:white;
            border:none;
            font-size:18px;
        }

        .upload-btn{
            background:#25D366;
            color:white;
            padding:15px 35px;
            border:none;
            border-radius:40px;
            cursor:pointer;
            font-size:18px;
            font-weight:600;
        }

        #uploadStatus{
            margin-top:20px;
            font-weight:600;
        }

        .gallery-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .photo-box{
            background:var(--card-bg);
            border-radius:15px;
            overflow:hidden;
            aspect-ratio:4/3;
            cursor:pointer;
            position:relative;
        }

        .photo-box img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            transition:0.3s;
        }

        .photo-box img:hover{
            transform:scale(1.05);
        }

        #loader{
            margin-top:20px;
            color:var(--text-muted);
            font-size:18px;
        }

        @media(max-width:768px){

            h1{
                font-size:38px;
            }

            h2{
                font-size:30px;
            }

            .upload-box{
                padding:25px;
            }

        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            Aashu<span>Tiles.</span>
        </div>

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </header>

    <section>

        <h1>
            Aashu Tiles & 
            <span style="color:#d4af37">
                Stones Work
            </span>
        </h1>

        <p style="margin-top:15px;color:#94a3b8;font-size:22px;">
            Shamli, Uttar Pradesh
        </p>

    </section>

    <section>

        <h2>
            Photo 
            <span style="color:#d4af37">
                Upload Karein
            </span>
        </h2>

        <div class="upload-box">

            <input 
                type="file" 
                id="photoInput" 
                accept="image/*" 
                multiple
            >

            <label for="photoInput" class="choose-btn">
                📸 Photos Choose Karein
            </label>

            <select id="categorySelect">

                <option value="">
                    -- Category Select Karein --
                </option>

                <option value="floor-tiles">
