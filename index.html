<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashu Tiles & Stones Work | Shamli</title>
    
    <style>
        :root {
            --bg-color: #0b111e; --card-bg: #151f32; --accent-color: #d4af37;
            --text-main: #ffffff; --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 8%; background: rgba(11,17,30,0.95); position: fixed; 
            width: 100%; top: 0; z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 700; }
        .logo span { color: var(--accent-color); }

        .hamburger { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .hamburger span { width: 28px; height: 3px; background: white; }

        section { padding: 90px 8% 60px; text-align: center; }
        h2 span { color: var(--accent-color); }

        .upload-box { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 40px;
                      border-radius: 15px; border: 2px dashed var(--accent-color); }

        .category-filters { margin: 25px 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn { padding: 10px 18px; background: var(--card-bg); color: var(--text-muted); 
                      border: none; border-radius: 30px; cursor: pointer; }
        .filter-btn.active { background: var(--accent-color); color: #0b111e; }

        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
        }
        .photo-box { 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            aspect-ratio: 4/3; 
            cursor: pointer;
        }
        .photo-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aashu<span>Tiles.</span></div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <section id="home">
        <h1>Aashu Tiles & <span>Stones Work</span></h1>
        <p>Shamli • Tiles • Marble • Granite • Kitchen Work</p>
    </section>

    <section class="upload-section">
        <h2>Photo <span>Upload Karein</span></h2>
        <div class="upload-box">
            <input type="file" id="photoInput" accept="image/*" multiple>
            <label for="photoInput" style="background:var(--accent-color); color:#0b111e; padding:14px 35px; border-radius:30px; cursor:pointer; display:inline-block; margin:15px 0;">
                📸 Photo Choose Karein
            </label>
            
            <select id="categorySelect" style="width:100%; padding:12px; margin:15px 0; border-radius:8px; background:#1e2a44; color:white;">
                <option value="">-- Category Select Karein --</option>
                <option value="floor-tiles">Floor Tiles</option>
                <option value="wall-tiles">Wall Tiles</option>
                <option value="stone">Stone / Marble</option>
                <option value="modular-kitchen">Modular Kitchen</option>
                <option value="pillar">Pillar Design</option>
                <option value="step-riser">Step Riser</option>
                <option value="elevation">Elevation</option>
                <option value="others">Others</option>
            </select>
