<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashu Tiles & Stones Work | Shamli</title>
    
    <meta name="description" content="Shamli me Tiles, Marble, Granite aur Kitchen ka best kaam">

    <style>
        :root {
            --bg: #0b111e;
            --card: #151f32;
            --gold: #d4af37;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: white; line-height: 1.6; }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(11,17,30,0.95);
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 700; }
        .logo span { color: var(--gold); }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }
        .hamburger span {
            width: 30px;
            height: 3px;
            background: white;
        }

        section { padding: 100px 8% 60px; text-align: center; }

        .upload-box {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            padding: 40px;
            border-radius: 15px;
            border: 2px dashed var(--gold);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .photo-box {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            cursor: pointer;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            background: #25D366;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aashu<span>Tiles.</span></div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <section>
        <h1>Aashu Tiles & <span style="color:var(--gold)">Stones Work</span></h1>
        <p style="margin-top:15px; color:#94a3b8;">Shamli, Uttar Pradesh</p>
    </section>

    <section class="upload-section">
        <h2>Photo <span style="color:var(--gold)">Upload Karein</span></h2>
        <div class="upload-box">
            <input type="file" id="photoInput" accept="image/*" multiple>
            <label for="photoInput" style="background:var(--gold); color:black; padding:12px 30px; border-radius:30px; cursor:pointer; display:inline-block; margin:15px 0;">
                📸 Photos Choose Karein
            </label>
            
            <select id="categorySelect" style="width:100%; padding:12px; margin:15px 0; border-radius:8px; background:#1e2a44; color:white;">
                <option value="">Category Select Karein</option>
                <option value="floor-tiles">Floor Tiles</option>
                <option value="wall-tiles">Wall Tiles</option>
                <option value="stone">Stone / Marble</option>
                <option value="modular-kitchen">Modular Kitchen</option>
                <option value="pillar">Pillar Design</option>
                <option value="step-riser">Step Riser</option>
                <option value="elevation">Elevation</option>
            </select>

            <button onclick="uploadPhotos()">Upload to Gallery</button>
            <div id="uploadStatus" style="margin-top:15px; font-weight:bold;"></div>
        </div>
    </section>

    <section id="gallery">
        <h2>Photo <span style="color:var(--gold)">Gallery</span></h2>
        <div id="loader">Loading Photos...</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } 
                from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDytvRwPLXyIvrNhLfX-yaoiarjZqQglso",
            authDomain: "aashu-tiles.firebaseapp.com",
            projectId: "aashu-tiles"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_KEY = "fe777ba740a06fa8c43847b43122bea4";

        let allPhotos = [];

        // Upload Function
        window.uploadPhotos = async function() {
            const files = document.getElementById('photoInput').files;
            const category = document.getElementById('categorySelect').value;
            
            if (files.length === 0) return alert("Photo select karein");
            if (!category) return alert("Category select karein");

            const status = document.getElementById('uploadStatus');
            status.textContent = "Uploading... Please wait";

            for (let file of files) {
                const formData = new FormData();
                formData.append("image", file);

                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
                        method: "POST",
                        body: formData
                    });
                    const data = await res.json();

                    if (data.success) {
                        await addDoc(collection(db, "gallery"), {
                            url: data.data.url,
                            name: file.name,
                            category: category,
                            timestamp: serverTimestamp()
                        });
                    }
                } catch(e) {
                    console.error(e);
                }
            }

            status.textContent = `✅ ${files.length} Photos Upload Ho Gayi!`;
            document.getElementById('photoInput').value = '';
            document.getElementById('categorySelect').value = '';
        };

        // Load Gallery
        onSnapshot(collection(db, "gallery"), (snapshot) => {
            document.getElementById('loader').style.display = 'none';
            
            allPhotos = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            })).sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

            renderGallery();
        });

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (allPhotos.length === 0) {
                grid.innerHTML = `<p style="color:#94a3b8; padding:60px; grid-column:1/-1;">Abhi koi photo nahi hai.<br>Upload karke dekhein.</p>`;
                return;
            }

            allPhotos.forEach(photo => {
                const div = document.createElement('div');
                div.className = 'photo-box';
                div.innerHTML = `<img src="\( {photo.url}" loading="lazy" onclick="openLightbox(' \){photo.url}')">`;
                grid.appendChild(div);
            });
        }

        window.openLightbox = function(url) {
            const lb = document.createElement('div');
            lb.style = `position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000; display:flex; align-items:center; justify-content:center;`;
            lb.innerHTML = `
                <img src="${url}" style="max-height:95vh; max-width:95vw; border-radius:12px;">
                <button onclick="this.parentElement.remove()" style="position:absolute; top:25px; right:25px; font-size:40px; color:white; background:none; border:none;">×</button>
            `;
            document.body.appendChild(lb);
        };

        window.toggleMenu = function() {
            alert("Menu Option jaldi aa raha hai");
        };
    </script>
</body>
</html>
