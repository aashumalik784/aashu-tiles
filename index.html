<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aashu Tiles & Stones Work | Shamli</title>

    <style>
        :root{
            --bg-color:#0b111e;
            --card-bg:#151f32;
            --accent-color:#d4af37;
            --text-main:#ffffff;
            --text-muted:#94a3b8;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:var(--bg-color);
            color:var(--text-main);
        }

        header{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            background:rgba(11,17,30,0.95);
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            z-index:1000;
            backdrop-filter:blur(10px);
        }

        .logo{
            font-size:24px;
            font-weight:700;
        }

        .logo span{
            color:var(--accent-color);
        }

        .hamburger{
            display:flex;
            flex-direction:column;
            gap:5px;
            cursor:pointer;
        }

        .hamburger span{
            width:30px;
            height:3px;
            background:white;
            border-radius:10px;
        }

        section{
            padding:100px 8% 60px;
            text-align:center;
        }

        h1{
            font-size:45px;
            margin-bottom:15px;
        }

        h2{
            font-size:35px;
            margin-bottom:20px;
        }

        p{
            color:var(--text-muted);
        }

        .upload-box{
            max-width:650px;
            margin:auto;
            background:var(--card-bg);
            padding:40px;
            border-radius:20px;
            border:2px dashed var(--accent-color);
        }

        input[type="file"]{
            display:none;
        }

        .choose-btn{
            background:var(--accent-color);
            color:black;
            padding:14px 35px;
            border-radius:30px;
            cursor:pointer;
            display:inline-block;
            margin:15px 0;
            font-weight:600;
        }

        select{
            width:100%;
            padding:14px;
            margin:15px 0;
            border:none;
            border-radius:10px;
            background:#1e2a44;
            color:white;
            font-size:16px;
        }

        .upload-btn{
            background:#25D366;
            color:white;
            padding:14px 35px;
            border:none;
            border-radius:30px;
            cursor:pointer;
            font-size:16px;
            font-weight:600;
        }

        #uploadStatus{
            margin-top:15px;
            font-weight:600;
        }

        #loader{
            margin-top:20px;
            color:var(--text-muted);
        }

        .gallery-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:20px;
            margin-top:40px;
        }

        .photo-box{
            background:var(--card-bg);
            border-radius:15px;
            overflow:hidden;
            aspect-ratio:4/3;
            cursor:pointer;
            transition:0.3s;
        }

        .photo-box:hover{
            transform:translateY(-5px);
        }

        .photo-box img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        @media(max-width:768px){

            h1{
                font-size:32px;
            }

            h2{
                font-size:28px;
            }

            .upload-box{
                padding:25px;
            }
        }
    </style>
</head>
