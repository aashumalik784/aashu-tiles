<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashu Tiles & Stones Work | Gallery with Backend</title>
    
    <style>
        :root {
            --bg-color: #0b111e; --card-bg: #151f32; --accent-color: #d4af37;
            --text-main: #ffffff; --text-muted: #94a3b8; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; 
                 background: rgba(11, 17, 30, 0.9); backdrop-filter: blur(10px); position: fixed; 
                 width: 100%; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 700; }
        .logo span { color: var(--accent-color); }
        
        /* Sections */
        .gallery, .upload-section, .admin-section { padding: 100px 8% 80px; text-align: center; }
        .gallery h2, .upload-section h2 { font-size: 2.3rem; margin-bottom: 15px; }
        .gallery h2 span, .upload-section h2 span { color: var(--accent-color); }
        .sub-title { color: var(--text-muted); margin-bottom: 40px; }
        
        /* Upload Box */
        .upload-box { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 40px;
                      border-radius: 15px; border: 2px dashed rgba(212, 175, 55, 0.3); }
        .upload-box input[type="file"] { display: none; }
        .upload-label { display: inline-block; background: var(--accent-color); color: #0b111e;
                        padding: 12px 30px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .upload-btn { margin-top: 20px; background: #25D366; color: white; border: none;
                      padding: 12px 30px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #progressBar { width: 100%; height: 6px; background: var(--card-bg); border-radius: 10px; 
                       margin-top: 20px; overflow: hidden; display: none; }
        #progressFill { height: 100%; background: var(--accent-color); width: 0%; transition: 0.3s; }
        
        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                        gap: 25px; margin-top: 30px; }
        .photo-box { background-color: var(--card-bg); border-radius: 12px; overflow: hidden;
                     position: relative; aspect-ratio: 4/3; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-caption { padding: 12px; font-size: 0.9rem; color: var(--text-muted); text-align: left; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: var(--danger);
                      color: white; border: none; width: 30px; height: 30px; border-radius: 50%;
                      cursor: pointer; font-size: 16px; display: none; }
        .admin-mode .delete-btn { display: block; }
        
        /* Admin Login */
        .admin-section { background: rgba(239, 68, 68, 0.1); padding: 40px 8%; }
        .admin-login input { padding: 10px 20px; border-radius: 20px; border: 1px solid var(--text-muted);
                             background: var(--card-bg); color: white; margin-right: 10px; }
        .admin-login button { padding: 10px 25px; border-radius: 20px; border: none;
                              background: var(--danger); color: white; font-weight: 600; cursor: pointer; }
        .admin-status { margin-top: 15px; color: var(--accent-color); font-weight: 600; }
        
        .loader { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aashu<span>Tiles.</span></div>
    </header>

    <!-- Upload Section -->
    <section class="upload-section">
        <h2>Photo <span>Upload Karein</span></h2>
        <p class="sub-title">Apne kaam ki photo gallery me add karein. Sab visitors ko dikhegi</p>
        <div class="upload-box">
            <input type="file" id="photoInput" accept="image/*" multiple>
            <label for="photoInput" class="upload-label">📸 Photo Choose Karein</label>
            <div id="fileName" style="margin-top: 15px; color: var(--text-muted);"></div>
            <button class="upload-btn" id="uploadBtn" onclick="uploadPhotos()">Gallery Me Add Karein</button>
            <div id="progressBar"><div id="progressFill"></div></div>
        </div>
    </section>

    <!-- Gallery -->
    <section class="gallery" id="gallery">
        <h2>Hamari <span>Photo Gallery</span></h2>
        <p class="sub-title">Real projects - Uploaded by users</p>
        <div class="loader" id="loader">Loading photos...</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <!-- Admin Section -->
    <section class="admin-section">
        <h3>🔒 Admin Panel</h3>
        <div class="admin-login" id="adminLogin">
            <input type="password" id="adminPass" placeholder="Admin Password">
            <button onclick="adminLogin()">Login</button>
        </div>
        <div class="admin-status" id="adminStatus"></div>
    </section>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, serverTimestamp } 
                from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } 
                from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

        // TODO: Apna Firebase Config Yahan Paste Karo
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        // Admin Password - Isko change kar dena
        const ADMIN_PASSWORD = "aashu@2026";
        let isAdmin = false;

        const photoInput = document.getElementById('photoInput');
        const fileNameDiv = document.getElementById('fileName');
        const galleryGrid = document.getElementById('galleryGrid');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const loader = document.getElementById('loader');

        photoInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileNameDiv.textContent = `${this.files.length} photo selected`;
            }
        });

        // Upload Photos
        window.uploadPhotos = async function() {
            const files = photoInput.files;
            if (files.length === 0) {
                alert('Pehle photo choose karo');
                return;
            }

            uploadBtn.disabled = true;
            progressBar.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileName = `${Date.now()}_${file.name}`;
                const storageRef = ref(storage, `gallery/${fileName}`);
                const uploadTask = uploadBytesResumable(storageRef, file);

                await new Promise((resolve, reject) => {
                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            progressFill.style.width = progress + '%';
                        },
                        (error) => { alert('Upload failed: ' + error); reject(error); },
                        async () => {
                            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                            await addDoc(collection(db, "gallery"), {
                                url: downloadURL,
                                name: file.name,
                                fileName: fileName,
                                timestamp: serverTimestamp()
                            });
                            resolve();
                        }
                    );
                });
            }

            photoInput.value = '';
            fileNameDiv.textContent = 'Upload successful!';
            uploadBtn.disabled = false;
            progressBar.style.display = 'none';
            progressFill.style.width = '0%';
            setTimeout(() => fileNameDiv.textContent = '', 3000);
        }

        // Real-time Gallery Load
        onSnapshot(collection(db, "gallery"), (snapshot) => {
            loader.style.display = 'none';
            galleryGrid.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                addPhotoToGallery(data.url, data.name, docSnap.id, data.fileName);
            });
        });

        function addPhotoToGallery(url, name, docId, fileName) {
            const photoBox = document.createElement('div');
            photoBox.className = 'photo-box';
            photoBox.innerHTML = `
                <img src="${url}" alt="${name}" loading="lazy">
                <button class="delete-btn" onclick="deletePhoto('${docId}', '${fileName}')">×</button>
                <div class="photo-caption">${name.substring(0, 25)}</div>
            `;
            galleryGrid.appendChild(photoBox);
        }

        // Admin Login
        window.adminLogin = function() {
            const pass = document.getElementById('adminPass').value;
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                document.getElementById('adminStatus').textContent = '✅ Admin Mode Active - Delete button dikh raha hai';
                document.getElementById('adminLogin').style.display = 'none';
            } else {
                alert('Galat password');
            }
        }

        // Delete Photo - Admin Only
        window.deletePhoto = async function(docId, fileName) {
            if (!isAdmin) {
                alert('Admin login required');
                return;
            }
            if (confirm('Photo delete karni hai?')) {
                await deleteDoc(doc(db, "gallery", docId));
                const storageRef = ref(storage, `gallery/${fileName}`);
                await deleteObject(storageRef);
            }
        }
    </script>

</body>
</html>
