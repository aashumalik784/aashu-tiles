<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashu Tiles & Stones Work | Shamli</title>

    <style>
        :root {
            --bg-color: #0b111e; --card-bg: #151f32; --accent-color: #d4af37;
            --text-main: #ffffff; --text-muted: #94a3b8; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 8%; background: rgba(11,17,30,0.95); position: fixed; 
            width: 100%; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 700; }
        .logo span { color: var(--accent-color); }

        .hamburger { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .hamburger span { width: 28px; height: 3px; background: white; }

        .mobile-nav { display: none; position: absolute; top: 75px; left: 0; width: 100%; 
                      background: #0b111e; flex-direction: column; padding: 20px 8%; }
        .mobile-nav.active { display: flex; }

        section { padding: 90px 8% 60px; text-align: center; }
        h2 span { color: var(--accent-color); }

        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
        }
        .photo-box { 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            aspect-ratio: 4/3; 
            cursor: pointer;
        }
        .photo-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .delete-btn { 
            position: absolute; top: 10px; right: 10px; 
            background: var(--danger); color: white; 
            border: none; width: 35px; height: 35px; 
            border-radius: 50%; font-size: 22px; display: none;
        }
        .admin-mode .delete-btn { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aashu<span>Tiles.</span></div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <section id="home">
        <h1>Aashu Tiles & <span>Stones Work</span></h1>
        <p>Ghar ko banayein aur bhi khoobsurat!</p>
    </section>

    <section>
        <h2>Photo <span>Gallery</span></h2>
        <div id="loader">Loading photos...</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <!-- Admin -->
    <section style="background:rgba(239,68,68,0.1); padding:40px 8%;">
        <h3>🔒 Admin Panel</h3>
        <input type="password" id="adminPass" placeholder="Password" style="padding:12px; width:280px;">
        <button onclick="adminLogin()" style="padding:12px 25px; background:var(--danger); color:white; border:none;">Login</button>
    </section>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, onSnapshot, deleteDoc, doc, serverTimestamp } 
                from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const app = initializeApp({
            apiKey: "AIzaSyDytvRwPLXyIvrNhLfX-yaoiarjZqQglso",
            authDomain: "aashu-tiles.firebaseapp.com",
            projectId: "aashu-tiles"
        });
        const db = getFirestore(app);

        let isAdmin = false;
        let allPhotos = [];

        // Real-time Photos Load
        onSnapshot(collection(db, "gallery"), (snapshot) => {
            document.getElementById('loader').style.display = 'none';
            
            allPhotos = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            })).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

            renderPhotos();
        });

        function renderPhotos() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (allPhotos.length === 0) {
                grid.innerHTML = `<p style="color:#94a3b8; padding:40px;">Abhi koi photo nahi hai. Pehle upload karein.</p>`;
                return;
            }

            allPhotos.forEach(photo => {
                const div = document.createElement('div');
                div.className = 'photo-box';
                div.innerHTML = `
                    <img src="\( {photo.url}" loading="lazy" onclick="openLightbox(' \){photo.url}')">
                    <button class="delete-btn" onclick="deletePhoto('${photo.id}')">×</button>
                `;
                grid.appendChild(div);
            });
        }

        function openLightbox(url) {
            const lb = document.createElement('div');
            lb.style = `position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.97);z-index:10000;display:flex;align-items:center;justify-content:center;`;
            lb.innerHTML = `
                <img src="${url}" style="max-height:95vh; max-width:95vw; border-radius:12px;">
                <button onclick="this.parentElement.remove()" style="position:absolute;top:20px;right:20px;font-size:40px;color:white;background:none;border:none;">×</button>
            `;
            document.body.appendChild(lb);
        }

        window.adminLogin = function() {
            if (btoa(document.getElementById('adminPass').value) === "YWFzaHVAMjAyNg==") {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                alert("✅ Admin Mode On - Delete buttons dikhege");
            } else {
                alert("❌ Galat Password");
            }
        };

        window.deletePhoto = async function(id) {
            if (!isAdmin) return alert("Admin login karein");
            if (confirm("Photo delete karni hai?")) {
                await deleteDoc(doc(db, "gallery", id));
            }
        };

        window.toggleMenu = function() {
            document.querySelector('.mobile-nav').classList.toggle('active');
        };
    </script>
</body>
</html>
