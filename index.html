<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashu Tiles & Stones Work | Premium Tiles, Marble, Granite Fitting in Shamli</title>
    
    <meta name="description" content="Shamli me Tiles Fitting, Marble, Granite, Kitchen Countertop aur Stone Cladding ka kaam.">

    <style>
        :root {
            --bg-color: #0b111e; --card-bg: #151f32; --accent-color: #d4af37;
            --text-main: #ffffff; --text-muted: #94a3b8; --danger: #ef4444; --success: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; 
                 background: rgba(11, 17, 30, 0.95); backdrop-filter: blur(10px); position: fixed; 
                 width: 100%; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 700; }
        .logo span { color: var(--accent-color); }

        .hero, .services, .upload-section, .gallery { padding: 80px 8%; text-align: center; }
        .hero h1 { font-size: 2.8rem; margin-bottom: 20px; }
        .hero h1 span { color: var(--accent-color); }

        .upload-box { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 40px;
                      border-radius: 15px; border: 2px dashed rgba(212, 175, 55, 0.4); }
        .upload-label { display: inline-block; background: var(--accent-color); color: #0b111e;
                        padding: 12px 30px; border-radius: 30px; font-weight: 600; cursor: pointer; margin: 15px 0; }

        .category-filters { margin: 25px 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .filter-btn { padding: 9px 16px; background: var(--card-bg); color: var(--text-muted); border: none; 
                      border-radius: 30px; cursor: pointer; font-size: 0.95rem; }
        .filter-btn.active { background: var(--accent-color); color: #0b111e; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .photo-box { background: var(--card-bg); border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 4/3; cursor: pointer; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-caption { padding: 10px; font-size: 0.85rem; color: var(--text-muted); }

        .delete-btn { position: absolute; top: 8px; right: 8px; background: var(--danger); color: white; 
                      border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; display: none; }
        .admin-mode .delete-btn { display: block; }

        .admin-section { display: none; } /* By default hidden */
        .admin-mode .admin-section { display: block; }

        .sticky-cta { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; gap: 12px; }
        .sticky-cta a { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items:center; justify-content:center; font-size: 26px; }
    </style>
</head>
<body>

    <!-- Header same as before -->
    <header>
        <div class="logo">Aashu<span>Tiles.</span></div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </header>

    <section class="hero">
        <h1>Aashu Tiles & <span>Stones Work</span></h1>
        <p>Shamli • Tiles • Marble • Granite • Kitchen • Elevation</p>
    </section>

    <section class="upload-section">
        <h2>Photo <span>Upload Karein</span></h2>
        <div class="upload-box">
            <input type="file" id="photoInput" accept="image/*" multiple>
            <label for="photoInput" class="upload-label">📸 Photo Choose Karein</label>
            
            <select id="categorySelect" style="width:100%; padding:12px; margin:15px 0; border-radius:8px; background:#1e2a44; color:white;">
                <option value="">-- Category Select Karein --</option>
                <option value="floor-tiles">Floor Tiles</option>
                <option value="wall-tiles">Wall Tiles</option>
                <option value="stone">Stone / Marble / Granite</option>
                <option value="modular-kitchen">Modular Kitchen</option>
                <option value="pillar">Pillar Design</option>
                <option value="step-riser">Step Riser / Seedhiyan</option>
                <option value="elevation">Elevation & Cladding</option>
                <option value="others">Others</option>
            </select>

            <button class="upload-btn" id="uploadBtn" style="background:#25D366; color:white; padding:12px 30px; border:none; border-radius:30px; font-weight:600;" onclick="uploadPhotos()">
                Upload to Gallery
            </button>
            <div id="progressBar" style="display:none; margin-top:15px;">
                <div id="progressFill" style="height:6px; background:var(--accent-color); width:0%; transition:0.4s;"></div>
            </div>
            <div id="uploadStatus" style="margin-top:10px; font-weight:600;"></div>
        </div>
    </section>

    <section class="gallery">
        <h2>Photo <span>Gallery</span></h2>
        <div class="category-filters" id="filters"></div>
        <div id="loader">Loading photos...</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <!-- Admin Panel (Hidden by default) -->
    <section class="admin-section">
        <h3>🔒 Admin Panel</h3>
        <input type="password" id="adminPass" placeholder="Password" style="padding:10px; width:70%; max-width:300px;">
        <button onclick="adminLogin()" style="padding:10px 20px; background:var(--danger);">Login</button>
    </section>

    <div class="sticky-cta">
        <a href="tel:+919627535352" style="background:#25D366;">📞</a>
        <a href="https://wa.me/919627535352" target="_blank" style="background:#128C7E;">💬</a>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } 
                from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = { /* your config */ 
          apiKey: "AIzaSyDytvRwPLXyIvrNhLfX-yaoiarjZqQglso",
          authDomain: "aashu-tiles.firebaseapp.com",
          projectId: "aashu-tiles"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "fe777ba740a06fa8c43847b43122bea4";

        let isAdmin = false;
        let allPhotos = [];

        const galleryGrid = document.getElementById('galleryGrid');
        const loader = document.getElementById('loader');
        const uploadBtn = document.getElementById('uploadBtn');

        // Create Filter Buttons
        const categories = [
            {val: "all", name: "All"},
            {val: "floor-tiles", name: "Floor Tiles"},
            {val: "wall-tiles", name: "Wall Tiles"},
            {val: "stone", name: "Stone Work"},
            {val: "modular-kitchen", name: "Modular Kitchen"},
            {val: "pillar", name: "Pillar"},
            {val: "step-riser", name: "Step Riser"},
            {val: "elevation", name: "Elevation"}
        ];

        const filtersDiv = document.getElementById('filters');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${cat.val === 'all' ? 'active' : ''}`;
            btn.textContent = cat.name;
            btn.dataset.category = cat.val;
            btn.onclick = () => filterGallery(cat.val);
            filtersDiv.appendChild(btn);
        });

        window.uploadPhotos = async () => {
            const files = document.getElementById('photoInput').files;
            const category = document.getElementById('categorySelect').value;

            if (files.length === 0) return alert("Photo select करें");
            if (!category) return alert("Category चुनें!");

            uploadBtn.disabled = true;
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('uploadStatus').textContent = 'Uploading...';

            for (let file of files) {
                const formData = new FormData();
                formData.append("image", file);

                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST", body: formData
                    });
                    const data = await res.json();

                    if (data.success) {
                        await addDoc(collection(db, "gallery"), {
                            url: data.data.url,
                            name: file.name,
                            category: category,
                            timestamp: serverTimestamp()
                        });
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            document.getElementById('uploadStatus').innerHTML = `✅ ${files.length} Photos Upload हो गई!`;
            document.getElementById('photoInput').value = '';
            document.getElementById('categorySelect').value = '';
            uploadBtn.disabled = false;
        };

        function filterGallery(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const filtered = cat === "all" ? allPhotos : allPhotos.filter(p => p.category === cat);
            renderPhotos(filtered);
        }

        function renderPhotos(photos) {
            galleryGrid.innerHTML = '';
            if (photos.length === 0) {
                galleryGrid.innerHTML = "<p style='color:#94a3b8; grid-column:1/-1;'>कोई फोटो नहीं मिली</p>";
                return;
            }
            photos.forEach(photo => {
                const div = document.createElement('div');
                div.className = 'photo-box';
                div.innerHTML = `
                    <img src="${photo.url}" loading="lazy">
                    <button class="delete-btn" onclick="deletePhoto('${photo.id}')">×</button>
                    <div class="photo-caption">${photo.name}</div>
                `;
                div.querySelector('img').onclick = () => openLightbox(photo.url);
                galleryGrid.appendChild(div);
            });
        }

        function openLightbox(url) {
            const lb = document.createElement('div');
            lb.style = `position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);z-index:10000;display:flex;align-items:center;justify-content:center;`;
            lb.innerHTML = `<img src="${url}" style="max-height:94vh;max-width:94vw;border-radius:10px;"> 
                            <button onclick="this.parentElement.remove()" style="position:absolute;top:20px;right:20px;font-size:40px;color:white;background:none;border:none;">×</button>`;
            document.body.appendChild(lb);
        }

        // Load Photos
        onSnapshot(collection(db, "gallery"), (snap) => {
            loader.style.display = 'none';
            allPhotos = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp?.seconds - a.timestamp?.seconds);
            renderPhotos(allPhotos);
        });

        window.adminLogin = function() {
            if (btoa(document.getElementById('adminPass').value) === "YWFzaHVAMjAyNg==") {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                alert("Admin Mode Activated");
            } else {
                alert("Wrong Password");
            }
        };

        window.deletePhoto = async function(id) {
            if (!isAdmin) return alert("Admin Login करें");
            if (confirm("Delete karna hai?")) {
                await deleteDoc(doc(db, "gallery", id));
            }
        };

        function toggleMenu() { alert("Menu coming soon"); }
    </script>
</body>
</html>
